            <div id="bankModal" class="fixed inset-0 hidden bg-black bg-opacity-40 flex items-center justify-center z-50 form-group">

                        <div class="mb-4">

                        </div>

                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                        <div class="flex justify-end gap-3">
                            <button type="submit" name="editBank" class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600">Save Changes</button>
                            <button type="submit" name="archiveBank" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">Archive</button>

        </div> <script>
        function openBankModal(id, name, status) {
            document.getElementById("bankId").value = id;
            document.getElementById("bankName").value = name;
            document.getElementById("status").value = status;
            document.getElementById("bankModal").classList.remove("hidden");
        }

        function closeBankModal() {
            document.getElementById("bankModal").classList.add("hidden");
        }

        document.addEventListener('DOMContentLoaded', function () {
            const depositModal = document.getElementById('depositModal');
            const withdrawModal = document.getElementById('withdrawModal');
            const depositAmount = document.getElementById('depositAmount');
            const noCashMessage = document.getElementById('noCashMessage');

            function showModal(modal) { modal.classList.remove('hidden'); }
            function hideModal(modal) { modal.classList.add('hidden'); }

            let cashOnHand = <?php echo $cashOnHand; ?>;

            document.querySelectorAll('.open-deposit').forEach(btn => {
                btn.addEventListener('click', function (e) {
                    const type = btn.dataset.type || 'Bank';
                    document.getElementById('depositType').value = type;

                    if (type !== 'Bank' && type !== 'Owner') {
                        document.getElementById('bankSelectWrapper').classList.add('hidden');
                        document.getElementById('newBankWrapper').classList.add('hidden');
                        document.querySelector("[name='newBankName']").removeAttribute('required');
                        document.querySelector("[name='accountNo']").removeAttribute('required');
                        document.querySelector("[name='accountname']").removeAttribute('required');
                        document.getElementById('bankID').removeAttribute('required');
                    } else {
                        document.getElementById('bankSelectWrapper').classList.remove('hidden');
                        document.getElementById('newBankWrapper').classList.add('hidden');
                        document.querySelector("[name='newBankName']").removeAttribute('required');
                        document.querySelector("[name='accountNo']").removeAttribute('required');
                        document.querySelector("[name='accountname']").removeAttribute('required');
                        document.getElementById('bankID').setAttribute('required', 'true');
                    }

                    if (type === 'Bank') {
                        if (cashOnHand <= 0) {
                            depositAmount.classList.add('hidden');
                            noCashMessage.classList.remove('hidden');
                            document.querySelector("[name='amount']").removeAttribute('required');
                        } else {
                            noCashMessage.classList.add('hidden');
                            depositAmount.classList.remove('hidden');
                            depositAmount.value = cashOnHand.toFixed(2);
                            depositAmount.setAttribute('required', 'true');
                            depositAmount.setAttribute('max', cashOnHand);
                            depositAmount.addEventListener('input', function(e) {
                                if (parseFloat(e.target.value) > cashOnHand) {
                                    e.target.value = cashOnHand.toFixed(2);
                                }
                            });
                        }
                    } else {
                        depositAmount.classList.remove('hidden');
                        noCashMessage.classList.add('hidden');
                        depositAmount.value = '';
                        depositAmount.removeAttribute('max');
                        depositAmount.setAttribute('required', 'true');
                    }

                    showModal(depositModal);
                });
            });

            const openWithdrawBtn = document.getElementById('open-withdraw');
            if (openWithdrawBtn) openWithdrawBtn.addEventListener('click', () => showModal(withdrawModal));

            document.querySelectorAll('[data-close-modal]').forEach(btn => {
                btn.addEventListener('click', function () {
                    const modalEl = btn.closest('.fixed');
                    if (modalEl) hideModal(modalEl);
                });
            });

            [depositModal, withdrawModal].forEach(modal => {
                if (!modal) return;
                modal.addEventListener('click', function (e) {
                    if (e.target === modal) hideModal(modal);
                });
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') {
                    hideModal(depositModal);
                    hideModal(withdrawModal);
                }
            });

            const addLink = document.getElementById('bankSelectAdd');
            const backLink = document.getElementById('bankSelectBack');
            if (addLink) addLink.addEventListener('click', function (ev) {
                ev.preventDefault();
                document.getElementById('bankSelectWrapper').classList.add('hidden');
                document.getElementById('newBankWrapper').classList.remove('hidden');
                document.querySelector("[name='newBankName']").setAttribute('required', 'true');
                document.querySelector("[name='accountNo']").setAttribute('required', 'true');
                document.querySelector("[name='accountname']").setAttribute('required', 'true');
                document.getElementById('bankID').removeAttribute('required');
            });
            if (backLink) backLink.addEventListener('click', function (ev) {
                ev.preventDefault();
                document.getElementById('bankSelectWrapper').classList.remove('hidden');
                document.getElementById('newBankWrapper').classList.add('hidden');
                document.querySelector("[name='newBankName']").removeAttribute('required');
                document.querySelector("[name='accountNo']").removeAttribute('required');
                document.querySelector("[name='accountname']").removeAttribute('required');
                document.getElementById('bankID').setAttribute('required', 'true');
            });

            window.openDepositModal = function(type) { 
                const btn = document.querySelector('.open-deposit[data-type="'+type+'"]'); 
                if (btn) btn.click(); 
            };
            window.openWithdrawModal = function() { openWithdrawBtn && openWithdrawBtn.click(); };

            function fetchData() {
                fetch('../../api/gl/add.php')
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            updateBankBalances(data.data.bankBalances);
                            updateBankDetails(data.data.banks);
                            updateFundDetails(data.data.fundDetails);
                            updateWithdrawOptions(data.data.banksForWithdraw);
                            cashOnHand = data.data.cashOnHand;
                            updateCashOnHand();
                        } else {
                            console.error('Error fetching data:', data.error);
                        }
                    })
                    .catch(error => console.error('Error:', error));
            }

            function updateBankBalances(bankBalances) {
                const balanceList = document.getElementById('bankBalancesList');
                balanceList.innerHTML = '';
                if (bankBalances.length > 0) {
                    bankBalances.forEach(bank => {
                        const li = document.createElement('li');
                        li.className = 'flex justify-between items-center py-3 hover:bg-gray-100 text-blue-700 rounded-lg px-2 transition';
                        li.innerHTML = `
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 flex items-center justify-center bg-blue-100 text-blue-600 rounded-full font-semibold">
                                    ${bank.bankName.charAt(0).toUpperCase()}
                                </div>
                                <span class="font-medium">${bank.bankName}</span>
                            </div>
                     <span class="font-bold text-green-600">₱${parseFloat(bank.availableBalance).toFixed(2)}</span>
                        `;
                        balanceList.appendChild(li);
                    });
                } else {
                    balanceList.innerHTML = '<li class="text-center py-4">No bank balances available.</li>';
                }
                document.getElementById('balanceUpdateTime').textContent = `Updated ${new Date().toLocaleString('en-US', { month: 'short', day: '2-digit', year: 'numeric' })}`;
            }

            function updateBankDetails(banks) {
                const tbody = document.querySelector('#bankDetailsTable tbody');
                tbody.innerHTML = '';
                if (banks.length > 0) {
                    banks.forEach(row => {
                        const tr = document.createElement('tr');
                        tr.className = 'cursor-pointer hover:bg-gray-100 transition';
                        tr.onclick = () => openBankModal(row.bankID, row.bankName, row.status);
                        tr.innerHTML = `
                            <td class="py-2 px-3">${row.bankName}</td>
                            <td class="py-2 px-3">${row.accountNo || 'N/A'}</td>
                            <td class="py-2 px-3">${row.accountName || 'N/A'}</td>
                            <td class="py-2 px-3">${row.status}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center p-4">No Records Found.</td></tr>';
                }
            }


            function updateWithdrawOptions(banksForWithdraw) {
                const select = document.getElementById('withdrawFundID');
                select.innerHTML = '<option value="">-- Choose Bank --</option>';
                banksForWithdraw.forEach(bank => {
                    const option = document.createElement('option');
                    option.value = bank.bankID;
                    option.textContent = `${bank.bankName} (₱${parseFloat(bank.useAmount).toFixed(2)})`;
                    select.appendChild(option);
                });
            }

            function updateCashOnHand() {
               
                const depositAmount = document.getElementById('depositAmount');
                const noCashMessage = document.getElementById('noCashMessage');
                const depositType = document.getElementById('depositType').value;
                if (depositType === 'Bank') {
                    if (cashOnHand <= 0) {
                        depositAmount.classList.add('hidden');
                        noCashMessage.classList.remove('hidden');
                        document.querySelector("[name='amount']").removeAttribute('required');
                    } else {
                        noCashMessage.classList.add('hidden');
                        depositAmount.classList.remove('hidden');
                        depositAmount.setAttribute('required', 'true');
                        depositAmount.setAttribute('max', cashOnHand);
                    }
                }
            }

            // Poll for updates every 5 seconds
            setInterval(fetchData, 5000);

            // Initial fetch
            fetchData();
        });
    </script>
